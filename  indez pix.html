<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Meu PIX</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f3f3f3; color: #171717;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: 100%; max-width: 390px; padding: 30px 24px;
      background: #fff; border-radius: 22px; text-align: center;
      box-shadow: 0 12px 36px rgba(0,0,0,.08);
    }
    .mark {
      width: 58px; height: 58px; margin: 0 auto 18px; display: grid;
      place-items: center; border-radius: 18px; background: #111; color: #fff;
      font-size: 27px; font-weight: 700;
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { margin: 0; color: #666; line-height: 1.5; }
    .key {
      margin: 25px 0 14px; padding: 16px 12px; border: 1px solid #e5e5e5;
      border-radius: 13px; font-size: 16px; font-weight: 600;
      overflow-wrap: anywhere; background: #fafafa;
    }
    button {
      width: 100%; border: 0; border-radius: 13px; padding: 16px;
      background: #111; color: white; font-size: 16px; font-weight: 650;
      cursor: pointer;
    }
    button:active { transform: scale(.99); }
    #status { min-height: 22px; margin-top: 12px; font-size: 13px; color: #16803c; }
    footer { margin-top: 22px; color: #999; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">₱</div>
    <h1>Faça um PIX</h1>
    <p>Copie a chave abaixo e pague pelo aplicativo do seu banco.</p>
    <div class="key" id="pixKey">fs29925550@gmail.com</div>
    <button type="button" id="copyButton">Copiar chave PIX</button>
    <div id="status" role="status" aria-live="polite"></div>
    <footer>Pagamento via PIX</footer>
  </main>
  <script>
    const key = "fs29925550@gmail.com";
    const status = document.getElementById("status");
    document.getElementById("copyButton").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(key);
        status.textContent = "Chave PIX copiada! Agora abra seu banco.";
      } catch (e) {
        status.textContent = "Selecione e copie a chave PIX acima.";
      }
    });
  </script>
</body>
</html>
